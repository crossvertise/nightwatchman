name: Deploy Nightwatchman to Azure

# Build, test & deploy to Azure App Service (Windows).
#   push → master     → build + tests + deploy
#   workflow_dispatch → manual deploy
#
# Authenticates against Azure via OIDC/Federated Credentials through the central
# GitHub Actions service principal — NO secrets, only repository *variables*:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_WEBAPP_NAME, AZURE_WEBAPP_URL
# The federated credential is bound to the GitHub environment "production".
#
# Publish is self-contained for win-x86 (32-bit worker of the App Service),
# so the deployment does not depend on the .NET runtime installed on the
# App Service.

on:
  push:
    branches: [master]
    paths:
      - 'MailReporter/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
  AZURE_WEBAPP_PACKAGE_PATH: ./publish
  CONFIGURATION: Release
  SOLUTION_PATH: MailReporter/MailReporter.sln
  PROJECT_PATH: MailReporter/Mvc/Mvc.csproj

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: MailReporter/global.json

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration ${{ env.CONFIGURATION }} --no-restore

      # Unit and integration tests. The integration tests spin up the complete app
      # against a real mongod (EphemeralMongo downloads the binary).
      - name: Test
        run: dotnet test ${{ env.SOLUTION_PATH }} --configuration ${{ env.CONFIGURATION }} --no-build

      - name: Publish (self-contained win-x86)
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration ${{ env.CONFIGURATION }} -r win-x86 --self-contained true --output ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: ${{ vars.AZURE_WEBAPP_URL }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      # The Mandrill HEAD endpoint is anonymous and serves as a health check.
      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -I ${{ vars.AZURE_WEBAPP_URL }}/MailReporter/Mandrill || true)
            echo "Attempt $i: HEAD /MailReporter/Mandrill -> $STATUS"
            if [ "$STATUS" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "Smoke test failed" && exit 1
